<!DOCTYPE html>
<html>
<head>
    <title>Mis hábitos</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hábitos">

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 45px 25px;
            background-color: #f5f5f5;
        }


        /* ENCABEZADO */

        .encabezado {
            position: relative;
            margin-bottom: 65px;
            text-align: center;
        }


        .titulo {
            font-size: 83px;
            font-weight: bold;
            margin: 0;
        }


        /* BOTÓN AGREGAR */

        .boton-agregar {
            position: absolute;

            right: 0;
            top: 50%;

            transform: translateY(-50%);

            font-size: 58px;

            width: 98px;
            height: 98px;

            border: none;
            border-radius: 50%;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* LISTA */

        .tabla {
            width: 100%;
            max-width: 910px;
            margin: auto;
        }


        /* CONTENEDOR DE CADA HÁBITO */

        .contenedor-habito {
            display: flex;
            align-items: center;

            margin-bottom: 20px;
        }


        /* BOTÓN BORRAR */

        .boton-borrar {
            margin-right: 13px;

            font-size: 38px;

            width: 58px;
            height: 58px;

            border: none;
            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* CUADRO DEL HÁBITO */

        .fila {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background-color: white;

            padding: 33px;

            border-radius: 20px;

            transition: background-color 0.2s;
        }


        /* HÁBITO HECHO */

        .fila.hecho {
            background-color: #70d47a;
        }


        .nombre-habito {
            font-size: 36px;
            font-weight: bold;
        }


        /* RACHA */

        .racha {
            font-size: 36px;
            font-weight: bold;

            margin-right: 20px;
        }


        /* BOTÓN HECHO */

        .boton-hecho {
            padding: 16px 26px;

            font-size: 29px;

            border: none;
            border-radius: 13px;

            cursor: pointer;
        }


        .boton-hecho:disabled {
            cursor: default;
        }


        /* BOTÓN REINICIAR */

        .boton-reiniciar {
            margin-left: 13px;

            font-size: 36px;

            width: 58px;
            height: 58px;

            border: none;

            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* TEMPORIZADOR */

        .temporizador-contenedor {
            margin: 70px auto 20px auto;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 35px;

            font-weight: bold;
        }


        .tiempo {
            font-size: 34px;
        }


        .dia {
            font-size: 34px;
        }


        /* MENSAJE ANTES DE COMENZAR */

        .sin-iniciar {
            text-align: center;

            margin-top: 70px;

            font-size: 25px;

            font-weight: bold;
        }


        /* BOTÓN DE PRUEBA */

        .boton-prueba {
            display: block;

            margin: 25px auto;

            padding: 15px 25px;

            font-size: 22px;

            border: none;

            border-radius: 12px;

            cursor: pointer;
        }

    </style>
</head>


<body>


    <!-- TÍTULO Y BOTÓN AGREGAR -->

    <div class="encabezado">

        <h1 class="titulo">
            Mis hábitos
        </h1>


        <button
            class="boton-agregar"
            onclick="agregarHabito()">

            +

        </button>

    </div>


    <!-- LISTA DE HÁBITOS -->

    <div
        id="tabla"
        class="tabla">
    </div>


    <!-- TEMPORIZADOR -->

    <div
        id="temporizador"
        class="temporizador-contenedor">
    </div>


    <!-- BOTÓN TEMPORAL DE PRUEBA -->

    <button
        class="boton-prueba"
        onclick="avanzarDosHoras()">

        ⏩ +2 horas

    </button>



    <script>


        /*
        =====================================================
        DATOS
        =====================================================
        */


        let datos =
            JSON.parse(
                localStorage.getItem("datosHabitos")
            );


        /*
        Si no existen datos,
        creamos la estructura inicial.
        */

        if (!datos) {

            datos = {

                habitos: [],

                inicio: null,

                diaActual: 0,

                desfasePrueba: 0

            };

        }


        /*
        Compatibilidad con datos anteriores
        */

        if (datos.desfasePrueba === undefined) {

            datos.desfasePrueba = 0;

        }



        /*
        =====================================================
        INICIO DEL CICLO
        =====================================================
        */


        function iniciarCiclo() {

            datos.inicio = obtenerTiempo();

            datos.diaActual = 0;

            guardarDatos();

        }



        /*
        =====================================================
        OBTENER TIEMPO
        =====================================================
        */

        function obtenerTiempo() {

            return Date.now() +
                   datos.desfasePrueba;

        }



        /*
        =====================================================
        ACTUALIZAR DÍAS
        =====================================================
        */


        function actualizarDias() {


            if (!datos.inicio) {

                return;

            }


            const ahora =
                obtenerTiempo();


            const tiempoTranscurrido =
                ahora - datos.inicio;


            const nuevoDia =
                Math.floor(
                    tiempoTranscurrido /
                    (24 * 60 * 60 * 1000)
                );


            /*
            Si comenzó un nuevo día
            */

            if (
                nuevoDia >
                datos.diaActual
            ) {


                /*
                Revisamos cada hábito.
                */

                datos.habitos.forEach(
                    habito => {


                        /*
                        Si no hizo el hábito
                        durante el día anterior,
                        pierde la racha.
                        */

                        if (
                            habito.ultimoDia <
                            datos.diaActual
                        ) {

                            habito.racha = 0;

                        }


                        /*
                        Todos vuelven a estar
                        disponibles.
                        */

                        habito.hecho = false;

                    }
                );


                datos.diaActual =
                    nuevoDia;


                guardarDatos();

            }

        }



        /*
        =====================================================
        MOSTRAR HÁBITOS
        =====================================================
        */


        function mostrarHabitos() {


            const tabla =
                document.getElementById(
                    "tabla"
                );


            tabla.innerHTML = "";


            datos.habitos.forEach(
                (habito, indice) => {


                    const contenedor =
                        document.createElement(
                            "div"
                        );


                    contenedor.className =
                        "contenedor-habito";


                    contenedor.innerHTML = `


                        <!-- BORRAR -->

                        <button
                            class="boton-borrar"
                            onclick="borrarHabito(${indice})">

                            −

                        </button>


                        <!-- HÁBITO -->

                        <div
                            class="fila ${habito.hecho ? "hecho" : ""}">

                            <span
                                class="nombre-habito">

                                ${habito.nombre}

                            </span>


                            <div>

                                <span
                                    class="racha">

                                    🔥 ${habito.racha}

                                </span>


                                <button
                                    class="boton-hecho"
                                    onclick="marcarHabito(${indice})"
                                    ${habito.hecho ? "disabled" : ""}>

                                    ${habito.hecho
                                        ? "✓"
                                        : "Hecho"}

                                </button>

                            </div>

                        </div>


                        <!-- REINICIAR -->

                        <button
                            class="boton-reiniciar"
                            onclick="reiniciarHabito(${indice})">

                            ↺

                        </button>

                    `;


                    tabla.appendChild(
                        contenedor
                    );

                }
            );

        }



        /*
        =====================================================
        MARCAR HÁBITO
        =====================================================
        */


        function marcarHabito(indice) {


            /*
            Si todavía no comenzó ningún ciclo,
            empieza ahora.
            */

            if (!datos.inicio) {

                iniciarCiclo();

            }


            actualizarDias();


            const habito =
                datos.habitos[indice];


            /*
            No permitir marcar dos veces
            en el mismo día.
            */

            if (habito.hecho) {

                return;

            }


            /*
            Marcar como hecho.
            */

            habito.hecho = true;


            /*
            Guardamos en qué día se realizó.
            */

            habito.ultimoDia =
                datos.diaActual;


            /*
            Aumentamos la racha.
            */

            habito.racha++;


            guardarDatos();


            mostrarHabitos();

        }



        /*
        =====================================================
        AGREGAR HÁBITO
        =====================================================
        */


        function agregarHabito() {


            const nombre =
                prompt(
                    "Escribí el nuevo hábito:"
                );


            if (
                nombre === null ||
                nombre.trim() === ""
            ) {

                return;

            }


            const nuevoHabito = {

                nombre:
                    nombre.trim(),

                racha:
                    0,

                hecho:
                    false,

                ultimoDia:
                    -1

            };


            datos.habitos.push(
                nuevoHabito
            );


            guardarDatos();


            mostrarHabitos();

        }



        /*
        =====================================================
        REINICIAR RACHA
        =====================================================
        */


        function reiniciarHabito(indice) {


            const confirmar =
                confirm(
                    "¿Seguro que querés reiniciar la racha de este hábito?"
                );


            if (!confirmar) {

                return;

            }


            datos.habitos[indice].racha = 0;

            datos.habitos[indice].hecho = false;

            datos.habitos[indice].ultimoDia = -1;


            guardarDatos();


            mostrarHabitos();

        }



        /*
        =====================================================
        BORRAR HÁBITO
        =====================================================
        */


        function borrarHabito(indice) {


            const confirmar =
                confirm(
                    "¿Seguro que querés borrar este hábito?"
                );


            if (!confirmar) {

                return;

            }


            datos.habitos.splice(
                indice,
                1
            );


            guardarDatos();


            mostrarHabitos();

        }



        /*
        =====================================================
        GUARDAR
        =====================================================
        */


        function guardarDatos() {

            localStorage.setItem(

                "datosHabitos",

                JSON.stringify(datos)

            );

        }



        /*
        =====================================================
        TEMPORIZADOR
        =====================================================
        */


        function actualizarTemporizador() {


            const elemento =
                document.getElementById(
                    "temporizador"
                );


            /*
            Si todavía no empezó.
            */

            if (!datos.inicio) {

                elemento.innerHTML = `

                    <div
                        class="sin-iniciar">

                        El día comenzará cuando
                        marques tu primer hábito.

                    </div>

                `;

                return;

            }


            /*
            Actualizar días.
            */

            actualizarDias();


            const ahora =
                obtenerTiempo();


            const transcurrido =
                ahora - datos.inicio;


            const periodo =
                24 *
                60 *
                60 *
                1000;


            const transcurridoEnDia =
                transcurrido %
                periodo;


            let restante =
                periodo -
                transcurridoEnDia;


            /*
            Horas.
            */

            const horas =
                Math.floor(
                    restante /
                    (60 * 60 * 1000)
                );


            /*
            Minutos.
            */

            const minutos =
                Math.floor(
                    (
                        restante %
                        (60 * 60 * 1000)
                    ) /
                    (60 * 1000)
                );


            /*
            Segundos.
            */

            const segundos =
                Math.floor(
                    (
                        restante %
                        (60 * 1000)
                    ) /
                    1000
                );


            /*
            Agregar ceros.
            */

            const h =
                String(horas)
                .padStart(2, "0");


            const m =
                String(minutos)
                .padStart(2, "0");


            const s =
                String(segundos)
                .padStart(2, "0");


            elemento.innerHTML = `

                <div class="tiempo">

                    ${h}hs ${m}min ${s}seg

                </div>


                <div class="dia">

                    Día ${datos.diaActual}

                </div>

            `;

        }



        /*
        =====================================================
        BOTÓN TEMPORAL: AVANZAR 2 HORAS
        =====================================================
        */


        function avanzarDosHoras() {


            /*
            Sumamos 2 horas al tiempo
            virtual de la aplicación.
            */

            datos.desfasePrueba +=
                2 *
                60 *
                60 *
                1000;


            guardarDatos();


            /*
            Actualizamos todo inmediatamente.
            */

            actualizarDias();

            mostrarHabitos();

            actualizarTemporizador();

        }



        /*
        =====================================================
        INICIO
        =====================================================
        */


        actualizarDias();

        mostrarHabitos();

        actualizarTemporizador();


        /*
        Actualizar cada segundo.
        */

        setInterval(
            actualizarTemporizador,
            1000
        );

    </script>


</body>
</html>
