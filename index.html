<!DOCTYPE html>
<html>
<head>

    <title>Hábitos y Organizador</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hábitos">


    <style>

        /* =========================================
           GENERAL
        ========================================= */

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 35px 25px;
            background-color: #f5f5f5;
            color: #222;
            transition: background-color 0.3s, color 0.3s;
        }


        /* =========================================
           MODO OSCURO
        ========================================= */

        body.modo-oscuro {
            background-color: #121212;
            color: #eeeeee;
        }


        body.modo-oscuro .boton-nav {
            background-color: #1e1e1e;
            color: #eeeeee;
        }


        body.modo-oscuro .boton-nav.activo {
            background-color: #30343b;
        }


        body.modo-oscuro .fila {
            background-color: #1e1e1e;
            color: #eeeeee;
        }


        body.modo-oscuro .actividad {
            background-color: #1e1e1e;
            color: #eeeeee;
        }


        body.modo-oscuro .formulario {
            background-color: #1e1e1e;
            color: #eeeeee;
        }


        body.modo-oscuro .formulario input {
            background-color: #292929;
            color: #eeeeee;
            border-color: #555;
        }


        body.modo-oscuro .campo-hora input {
            background-color: #292929;
            color: #eeeeee;
            border-color: #555;
        }


        body.modo-oscuro .sugerencias-habitos {
            background-color: #242424;
            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.5);
        }


        body.modo-oscuro .sugerencia {
            background-color: #242424;
            color: #eeeeee;
            border-bottom-color: #444;
        }


        body.modo-oscuro .sugerencia:hover {
            background-color: #333333;
        }


        body.modo-oscuro .sugerencia:active {
            background-color: #3b3f45;
        }


        body.modo-oscuro .boton-agregar,
        body.modo-oscuro .boton-hecho,
        body.modo-oscuro .boton-completar,
        body.modo-oscuro .boton-agregar-actividad {
            background-color: #292929;
            color: #eeeeee;
        }


        body.modo-oscuro .boton-borrar,
        body.modo-oscuro .boton-reiniciar,
        body.modo-oscuro .boton-dia,
        body.modo-oscuro .boton-eliminar-actividad {
            color: #eeeeee;
        }


        body.modo-oscuro .fila.hecho,
        body.modo-oscuro .actividad.completada {
            background-color: #3f9148;
            color: white;
        }


        /* =========================================
           BOTÓN MODO OSCURO
        ========================================= */

        .contenedor-modo-oscuro {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 70px;
            margin-bottom: 15px;
        }


        .boton-modo-oscuro {
            border: none;
            background: transparent;
            color: #777;
            font-size: 17px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 10px;
            transition:
                background-color 0.2s,
                color 0.2s;
        }


        .boton-modo-oscuro:hover {
            background-color: #e5e5e5;
            color: #333;
        }


        body.modo-oscuro .boton-modo-oscuro {
            color: #bbbbbb;
        }


        body.modo-oscuro .boton-modo-oscuro:hover {
            background-color: #292929;
            color: #eeeeee;
        }


        /* =========================================
           NAVEGACIÓN
        ========================================= */

        .navegacion {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 45px;
        }


        .boton-nav {
            font-size: 32px;
            font-weight: bold;
            padding: 22px 30px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            background-color: white;
            min-width: 250px;
            min-height: 75px;
            color: #222;
        }


        .boton-nav.activo {
            background-color: #dce3e8;
        }


        /* =========================================
           PANTALLAS
        ========================================= */

        .pantalla {
            display: none;
        }


        .pantalla.activa {
            display: block;
        }


        /* =========================================
           MIS HÁBITOS
        ========================================= */

        .encabezado {
            position: relative;
            margin-bottom: 65px;
            text-align: center;
        }


        .titulo {
            font-size: 83px;
            font-weight: bold;
            margin: 0;
        }


        .boton-agregar {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 58px;
            width: 98px;
            height: 98px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background-color: white;
            color: #222;
        }


        .tabla {
            width: 100%;
            max-width: 910px;
            margin: auto;
        }


        .contenedor-habito {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }


        .boton-borrar {
            margin-right: 13px;
            font-size: 38px;
            width: 58px;
            height: 58px;
            border: none;
            background: transparent;
            cursor: pointer;
        }


        .fila {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: white;
            padding: 33px;
            border-radius: 20px;
            transition: background-color 0.2s;
        }


        .fila.hecho {
            background-color: #70d47a;
        }


        .nombre-habito {
            font-size: 36px;
            font-weight: bold;
        }


        .racha {
            font-size: 36px;
            font-weight: bold;
            margin-right: 20px;
        }


        .boton-hecho {
            padding: 16px 26px;
            font-size: 29px;
            border: none;
            border-radius: 13px;
            cursor: pointer;
            background-color: #f0f0f0;
            color: #222;
        }


        .boton-hecho:disabled {
            cursor: default;
        }


        .boton-reiniciar {
            margin-left: 13px;
            font-size: 36px;
            width: 58px;
            height: 58px;
            border: none;
            background: transparent;
            cursor: pointer;
        }


        /* =========================================
           TEMPORIZADOR DEL DÍA
        ========================================= */

        .temporizador-contenedor {
            margin: 70px auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            font-weight: bold;
        }


        .tiempo {
            font-size: 34px;
        }


        .dia {
            font-size: 28px;
        }


        /* =========================================
           ORGANIZADOR
        ========================================= */

        .organizador {
            width: min(1200px, 100%);
            margin: 0 auto;
            box-sizing: border-box;
        }


        .encabezado-organizador {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px 35px;
            margin-bottom: 40px;
        }


        .titulo-organizador {
            text-align: center;
            font-size: 65px;
            margin: 0;
            white-space: nowrap;
        }


        /* =========================================
           SELECTOR DE DÍA
        ========================================= */

        .selector-dia {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }


        .boton-dia {
            font-size: 40px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: inherit;
        }


        .dia-seleccionado {
            font-size: 45px;
            font-weight: bold;
            min-width: 300px;
            text-align: center;
        }


        /* =========================================
           ACTIVIDADES - 30% MÁS GRANDES
        ========================================= */

        .lista-actividades {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }


        .actividad {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 23px;
            padding: 26px;
            transition: background-color 0.2s;
        }


        .actividad.completada {
            background-color: #70d47a;
        }


        .horario {
            width: 312px;
            font-size: 36px;
            font-weight: bold;
        }


        .descripcion {
            flex: 1;
            font-size: 39px;
        }


        .etiqueta-habito {
            font-size: 23px;
            margin-top: 7px;
            font-weight: bold;
        }


        /* =========================================
           BOTÓN COMPLETAR - 30% MÁS GRANDE
        ========================================= */

        .boton-completar {
            margin-left: 20px;
            font-size: 35px;
            width: 75px;
            height: 75px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background-color: #f0f0f0;
            color: #222;
        }


        .boton-completar:disabled {
            opacity: 0.45;
            cursor: default;
        }


        /* =========================================
           ELIMINAR ACTIVIDAD
        ========================================= */

        .boton-eliminar-actividad {
            border: none;
            background: transparent;
            font-size: 39px;
            cursor: pointer;
            margin-left: 13px;
        }


        /* =========================================
           AGREGAR ACTIVIDAD - 30% MÁS GRANDE
        ========================================= */

        .boton-agregar-actividad {
            display: none;
            margin: 45px auto;
            font-size: 36px;
            padding: 23px 39px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: white;
            color: #222;
        }


        /* =========================================
           FORMULARIO
        ========================================= */

        .formulario {
            display: block;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            margin: 28px 0 0 0;
            background-color: white;
            padding: 36px;
            border-radius: 24px;
            position: relative;
            left: auto;
            bottom: auto;
            transform: none;
            z-index: 5;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
        }


        .formulario input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 22px;
            padding: 18px;
            font-size: 26px;
            border: 1px solid #ccc;
            border-radius: 12px;
            background-color: white;
            color: #222;
        }


        /* =========================================
           CAMPOS DE HORARIO
        ========================================= */

        .campo-hora {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 22px;
            width: 100%;
        }


        .campo-hora label {
            font-size: 26px;
            font-weight: bold;
            flex: 1;
        }


        .campo-hora input {
            width: 264px;
            margin-bottom: 0;
            text-align: center;
            font-size: 29px;
            padding: 18px;
            border: 2px solid #d0d0d0;
            border-radius: 14px;
            background-color: #f8f8f8;
        }


        .texto-o {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 18px;
        }


        /* =========================================
           CAMPO DE ACTIVIDAD
        ========================================= */

        .campo-actividad {
            position: relative;
        }


        .sugerencias-habitos {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            background-color: white;
            border-radius: 10px;
            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.15);
            z-index: 10;
            overflow: hidden;
            max-height: 300px;
            overflow-y: auto;
        }


        .sugerencia {
            padding: 20px;
            font-size: 23px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            background-color: white;
        }


        .sugerencia:hover {
            background-color: #f0f0f0;
        }


        .sugerencia:active {
            background-color: #dce3e8;
        }


        /* =========================================
           BOTÓN GUARDAR
        ========================================= */

        .boton-guardar {
            width: 100%;
            padding: 20px;
            font-size: 28px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            background-color: #70d47a;
            color: #111;
        }


        /* =========================================
           MENSAJE VACÍO
        ========================================= */

        .mensaje-vacio {
            text-align: center;
            font-size: 25px;
            margin-top: 50px;
            font-weight: bold;
        }


        /* =========================================
           POMODORO
        ========================================= */

        .pomodoro-contenedor {
            max-width: 1100px;
            min-height: calc(100vh - 190px);
            margin: 0 auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }


        .titulo-pomodoro {
            font-size: 91px;
            margin: 0 0 58px 0;
        }


        .pomodoro-configuracion {
            background-color: white;
            border-radius: 32px;
            padding: 46px;
            width: min(910px, calc(100vw - 40px));
            max-width: 910px;
            box-sizing: border-box;
            margin: 0 auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }


        .pomodoro-configuracion h2 {
            font-size: 42px;
            margin-top: 0;
            margin-bottom: 39px;
        }


        .campo-pomodoro {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 29px;
            gap: 26px;
        }


        .campo-pomodoro label {
            font-size: 33px;
            font-weight: bold;
            text-align: left;
        }


        .campo-pomodoro input {
            width: 195px;
            box-sizing: border-box;
            padding: 18px;
            font-size: 33px;
            text-align: center;
            border: 2px solid #d0d0d0;
            border-radius: 15px;
            background-color: #f8f8f8;
            color: #222;
        }


        .pomodoro-reloj {
            margin: 59px auto 33px auto;
            font-size: 130px;
            font-weight: bold;
            letter-spacing: 3px;
        }


        .pomodoro-estado {
            font-size: 49px;
            font-weight: bold;
            margin-bottom: 20px;
        }


        .pomodoro-ciclo {
            font-size: 33px;
            margin-bottom: 46px;
        }


        .botones-pomodoro {
            display: flex;
            justify-content: center;
            gap: 23px;
            flex-wrap: wrap;
        }


        .boton-pomodoro {
            border: none;
            border-radius: 20px;
            padding: 23px 39px;
            font-size: 33px;
            font-weight: bold;
            cursor: pointer;
            background-color: white;
            color: #222;
        }


        .boton-pomodoro.iniciar {
            background-color: #70d47a;
        }


        .boton-pomodoro:disabled {
            opacity: 0.45;
            cursor: default;
        }


        body.modo-oscuro .pomodoro-configuracion,
        body.modo-oscuro .boton-pomodoro {
            background-color: #1e1e1e;
            color: #eeeeee;
        }


        body.modo-oscuro .campo-pomodoro input {
            background-color: #292929;
            color: #eeeeee;
            border-color: #555;
        }


        body.modo-oscuro .boton-pomodoro.iniciar {
            background-color: #3f9148;
            color: white;
        }


        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }


            .navegacion {
                gap: 8px;
                margin-bottom: 35px;
            }


            .boton-nav {
                font-size: 17px;
                padding: 15px 5px;
                min-width: 0;
                width: 33.33%;
                min-height: 70px;
            }


            .titulo {
                font-size: 55px;
            }


            .boton-agregar {
                width: 70px;
                height: 70px;
                font-size: 45px;
            }


            .nombre-habito {
                font-size: 25px;
            }


            .racha {
                font-size: 25px;
                margin-right: 10px;
            }


            .boton-hecho {
                padding: 12px 17px;
                font-size: 21px;
            }


            .fila {
                padding: 22px 15px;
            }


            .encabezado-organizador {
                display: flex;
                flex-direction: column;
                gap: 14px;
                margin-bottom: 28px;
            }


            .titulo-organizador {
                font-size: clamp(40px, 11vw, 52px);
                white-space: normal;
                line-height: 1.05;
            }


            .dia-seleccionado {
                font-size: 32px;
                min-width: 0;
                width: auto;
            }


            .boton-dia {
                font-size: 32px;
            }


            /* Actividades adaptadas al celular */

            .actividad {
                padding: 18px;
                flex-wrap: wrap;
                gap: 10px;
                box-sizing: border-box;
                width: 100%;
            }


            .horario {
                width: 100%;
                font-size: 28px;
            }


            .descripcion {
                font-size: 29px;
                width: calc(100% - 90px);
            }


            .boton-completar {
                width: 62px;
                height: 62px;
                font-size: 30px;
            }


            .boton-eliminar-actividad {
                font-size: 32px;
            }


            .boton-agregar-actividad {
                display: none;
            }


            .campo-hora {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }


            .campo-hora label {
                font-size: 25px;
                text-align: center;
            }


            .campo-hora input {
                width: 100%;
                box-sizing: border-box;
                font-size: 29px;
                min-height: 68px;
            }


            .formulario {
                display: block;
                width: 100%;
                max-height: none;
                overflow: visible;
                box-sizing: border-box;
                padding: 24px 18px;
                margin-top: 24px;
                border-radius: 20px;
            }


            .texto-o {
                font-size: 26px;
                margin-top: 12px;
            }


            #descripcionActividad {
                font-size: 26px;
                min-height: 68px;
            }


            .sugerencia {
                font-size: 22px;
                padding: 22px 18px;
            }


            .contenedor-modo-oscuro {
                margin-top: 50px;
            }


            /* Pomodoro celular */

            .pomodoro-contenedor {
                min-height: calc(100vh - 155px);
                width: 100%;
            }

            .titulo-pomodoro {
                font-size: 65px;
                margin-bottom: 39px;
            }


            .pomodoro-configuracion {
                width: calc(100vw - 20px);
                padding: 32px 23px;
                border-radius: 28px;
            }


            .campo-pomodoro label {
                font-size: 25px;
            }


            .campo-pomodoro input {
                width: 143px;
                font-size: 27px;
                padding: 15px;
            }


            .pomodoro-reloj {
                font-size: 85px;
                margin-top: 46px;
            }


            .pomodoro-estado {
                font-size: 39px;
            }


            .pomodoro-ciclo {
                font-size: 27px;
            }


            .boton-pomodoro {
                font-size: 26px;
                padding: 20px 29px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVEGACIÓN
    ========================================= -->

    <div class="navegacion">


        <button
            id="navHabitos"
            class="boton-nav activo"
            onclick="mostrarPantalla('habitos')">

            🔥 Mis hábitos

        </button>


        <button
            id="navOrganizador"
            class="boton-nav"
            onclick="mostrarPantalla('organizador')">

            🗓️ Organizador

        </button>


        <button
            id="navPomodoro"
            class="boton-nav"
            onclick="mostrarPantalla('pomodoro')">

            ⏱️ Pomodoro

        </button>


    </div>



    <!-- =========================================
         PANTALLA MIS HÁBITOS
    ========================================= -->

    <div
        id="pantallaHabitos"
        class="pantalla activa">


        <div class="encabezado">


            <h1 class="titulo">
                Mis hábitos
            </h1>


            <button
                class="boton-agregar"
                onclick="agregarHabito()">

                +

            </button>


        </div>


        <div
            id="tabla"
            class="tabla">
        </div>


        <div
            id="temporizador"
            class="temporizador-contenedor">
        </div>


    </div>



    <!-- =========================================
         PANTALLA ORGANIZADOR
    ========================================= -->

    <div
        id="pantallaOrganizador"
        class="pantalla">


        <div class="organizador">


            <div class="encabezado-organizador">


                <h1 class="titulo-organizador">
                    Organizador
                </h1>


                <div class="selector-dia">


                    <button
                        class="boton-dia"
                        onclick="diaAnterior()">

                        ◀

                    </button>


                    <div
                        id="diaSeleccionado"
                        class="dia-seleccionado">
                    </div>


                    <button
                        class="boton-dia"
                        onclick="diaSiguiente()">

                        ▶

                    </button>


                </div>


            </div>



            <div
                id="listaActividades"
                class="lista-actividades">
            </div>



            <button
                class="boton-agregar-actividad"
                onclick="mostrarFormulario()">

                + Agregar actividad

            </button>



            <div
                id="formulario"
                class="formulario">


                <div class="campo-hora">


                    <label for="horaInicio">
                        🕐 Hora de inicio
                    </label>


                    <input
                        id="horaInicio"
                        type="time">


                </div>



                <div class="campo-hora">


                    <label for="horaFin">
                        🕐 Hora de finalización
                    </label>


                    <input
                        id="horaFin"
                        type="time">


                </div>



                <div class="texto-o">
                    ¿Qué vas a hacer?
                </div>



                <div class="campo-actividad">


                    <input
                        id="descripcionActividad"
                        type="text"
                        placeholder="Escribí una actividad..."
                        autocomplete="off"
                        onfocus="mostrarSugerencias()"
                        oninput="filtrarSugerencias">


                    <div
                        id="sugerenciasHabitos"
                        class="sugerencias-habitos">
                    </div>


                </div>



                <button
                    class="boton-guardar"
                    onclick="guardarActividad()">

                    Guardar actividad

                </button>


            </div>


        </div>


    </div>

    <div

        <div class="pomodoro-contenedor">

                    <label for="minutosDescanso">

                    <input

                    <label for="cantidadCiclos">

                        ⏸ Pausar
