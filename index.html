<!DOCTYPE html>
<html>
<head>
    <title>Mis hábitos</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hábitos">

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 45px 25px;
            background-color: #f5f5f5;
        }


        /* ENCABEZADO */

        .encabezado {
            position: relative;
            margin-bottom: 65px;
            text-align: center;
        }


        .titulo {
            font-size: 83px;
            font-weight: bold;
            margin: 0;
        }


        /* BOTÓN AGREGAR */

        .boton-agregar {
            position: absolute;

            right: 0;
            top: 50%;

            transform: translateY(-50%);

            font-size: 58px;

            width: 98px;
            height: 98px;

            border: none;
            border-radius: 50%;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* TABLA */

        .tabla {
            width: 100%;
            max-width: 910px;
            margin: auto;
        }


        /* CONTENEDOR DE CADA HÁBITO */

        .contenedor-habito {
            display: flex;
            align-items: center;

            margin-bottom: 20px;
        }


        /* BOTÓN BORRAR */

        .boton-borrar {
            margin-right: 13px;

            font-size: 38px;

            width: 58px;
            height: 58px;

            border: none;

            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* CUADRO DEL HÁBITO */

        .fila {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background-color: white;

            padding: 33px;

            border-radius: 20px;
        }


        .nombre-habito {
            font-size: 36px;
            font-weight: bold;
        }


        .contador {
            font-size: 36px;
            font-weight: bold;

            margin-right: 20px;
        }


        /* BOTÓN +1 */

        .boton-sumar {
            padding: 16px 26px;

            font-size: 29px;

            border: none;
            border-radius: 13px;

            cursor: pointer;
        }


        /* BOTÓN REINICIAR */

        .boton-reiniciar {
            margin-left: 13px;

            font-size: 36px;

            width: 58px;
            height: 58px;

            border: none;

            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>


<body>


    <!-- TÍTULO Y BOTÓN AGREGAR -->

    <div class="encabezado">

        <h1 class="titulo">
            Mis hábitos
        </h1>


        <button
            class="boton-agregar"
            onclick="agregarHabito()">

            +

        </button>

    </div>


    <!-- LISTA DE HÁBITOS -->

    <div
        id="tabla"
        class="tabla">
    </div>



    <script>


        // Cargar hábitos guardados

        let habitos =
            JSON.parse(
                localStorage.getItem("habitos")
            ) || [];


        mostrarHabitos();



        // Mostrar hábitos

        function mostrarHabitos() {

            const tabla =
                document.getElementById("tabla");


            tabla.innerHTML = "";


            habitos.forEach(
                (habito, indice) => {

                    const contenedor =
                        document.createElement("div");


                    contenedor.className =
                        "contenedor-habito";


                    contenedor.innerHTML = `

                        <!-- BORRAR -->

                        <button
                            class="boton-borrar"
                            onclick="borrarHabito(${indice})">

                            −

                        </button>


                        <!-- HÁBITO -->

                        <div class="fila">

                            <span class="nombre-habito">

                                ${habito.nombre}

                            </span>


                            <div>

                                <span class="contador">

                                    ${habito.contador}

                                </span>


                                <button
                                    class="boton-sumar"
                                    onclick="sumar(${indice})">

                                    +1

                                </button>

                            </div>

                        </div>


                        <!-- REINICIAR -->

                        <button
                            class="boton-reiniciar"
                            onclick="reiniciarHabito(${indice})">

                            ↺

                        </button>

                    `;


                    tabla.appendChild(
                        contenedor
                    );

                }
            );

        }



        // Agregar hábito

        function agregarHabito() {

            const nombre =
                prompt(
                    "Escribí el nuevo hábito:"
                );


            if (
                nombre === null ||
                nombre.trim() === ""
            ) {

                return;

            }


            const nuevoHabito = {

                nombre: nombre.trim(),

                contador: 0

            };


            habitos.push(
                nuevoHabito
            );


            guardarHabitos();

            mostrarHabitos();

        }



        // Sumar 1

        function sumar(indice) {

            habitos[indice].contador++;


            guardarHabitos();

            mostrarHabitos();

        }



        // Reiniciar hábito

        function reiniciarHabito(indice) {

            habitos[indice].contador = 0;


            guardarHabitos();

            mostrarHabitos();

        }



        // Borrar hábito

        function borrarHabito(indice) {

            const confirmar =
                confirm(
                    "¿Seguro que querés borrar este hábito?"
                );


            if (confirmar) {

                habitos.splice(indice, 1);


                guardarHabitos();

                mostrarHabitos();

            }

        }



        // Guardar información

        function guardarHabitos() {

            localStorage.setItem(

                "habitos",

                JSON.stringify(habitos)

            );

        }

    </script>


</body>
</html>
