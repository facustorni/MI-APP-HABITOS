    <!-- =========================================
         MODO OSCURO
    ========================================= -->

    <div class="contenedor-modo-oscuro">

        <button
            id="botonModoOscuro"
            class="boton-modo-oscuro"
            onclick="alternarModoOscuro()">

            🌙 Modo oscuro

        </button>

    </div>




    <!-- =================================================
         AUDIOS DEL POMODORO

         Subir estos 3 archivos a la MISMA carpeta que index.html:
         - pomodoro-aviso-trabajo.mp3
         - pomodoro-cambio.mp3
         - pomodoro-aviso-descanso.mp3
    ================================================= -->

    <audio id="audioAvisoTrabajo" src="pomodoro-aviso-trabajo.mp3" preload="auto"></audio>
    <audio id="audioCambioPomodoro" src="pomodoro-cambio.mp3" preload="auto"></audio>
    <audio id="audioAvisoDescanso" src="pomodoro-aviso-descanso.mp3" preload="auto"></audio>


    <script>


        /* =================================================
           MODO OSCURO
        ================================================= */


        function cargarModoOscuro() {

            const modoOscuro =
                localStorage.getItem("modoOscuro");


            if (modoOscuro === "true") {

                document.body.classList.add(
                    "modo-oscuro"
                );


                document.getElementById(
                    "botonModoOscuro"
                ).textContent =
                    "☀️ Modo claro";

            }

        }



        function alternarModoOscuro() {

            const estaActivo =
                document.body.classList.toggle(
                    "modo-oscuro"
                );


            localStorage.setItem(
                "modoOscuro",
                estaActivo
            );


            document.getElementById(
                "botonModoOscuro"
            ).textContent =
                estaActivo
                    ? "☀️ Modo claro"
                    : "🌙 Modo oscuro";

        }



        /* =================================================
           NAVEGACIÓN
        ================================================= */


        function mostrarPantalla(pantalla) {

            const habitos =
                document.getElementById(
                    "pantallaHabitos"
                );


            const organizador =
                document.getElementById(
                    "pantallaOrganizador"
                );


            const pomodoro =
                document.getElementById(
                    "pantallaPomodoro"
                );


            const navHabitos =
                document.getElementById(
                    "navHabitos"
                );


            const navOrganizador =
                document.getElementById(
                    "navOrganizador"
                );


            const navPomodoro =
                document.getElementById(
                    "navPomodoro"
                );


            habitos.classList.remove("activa");
            organizador.classList.remove("activa");
            pomodoro.classList.remove("activa");

            navHabitos.classList.remove("activo");
            navOrganizador.classList.remove("activo");
            navPomodoro.classList.remove("activo");


            if (pantalla === "habitos") {

                habitos.classList.add("activa");
                navHabitos.classList.add("activo");

            }


            else if (pantalla === "organizador") {

                organizador.classList.add("activa");
                navOrganizador.classList.add("activo");

                mostrarOrganizador();

            }


            else if (pantalla === "pomodoro") {

                pomodoro.classList.add("activa");
                navPomodoro.classList.add("activo");

            }

        }



        /* =================================================
           DATOS DE HÁBITOS
        ================================================= */


        let datosHabitos =
            JSON.parse(
                localStorage.getItem(
                    "datosHabitos"
                )
            );


        if (!datosHabitos) {

            datosHabitos = {
                habitos: []
            };

        }



        /* =================================================
           FECHAS
        ================================================= */


        function fechaLocal(fecha) {

            const año =
                fecha.getFullYear();


            const mes =
                String(
                    fecha.getMonth() + 1
                ).padStart(2, "0");


            const dia =
                String(
                    fecha.getDate()
                ).padStart(2, "0");


            return `${año}-${mes}-${dia}`;

        }



        function obtenerFechaHoy() {

            return fechaLocal(new Date());

        }



        function obtenerFechaMañana() {

            const fecha =
                new Date();


            fecha.setDate(
                fecha.getDate() + 1
            );


            return fechaLocal(fecha);

        }



        /* =================================================
           GUARDAR HÁBITOS
        ================================================= */


        function guardarDatosHabitos() {

            localStorage.setItem(
                "datosHabitos",
                JSON.stringify(datosHabitos)
            );

        }



        /* =================================================
           ACTUALIZAR HÁBITOS
        ================================================= */


        function actualizarHabitos() {

            const hoy =
                obtenerFechaHoy();


            const ayer =
                fechaLocal(
                    new Date(
                        Date.now() -
                        24 * 60 * 60 * 1000
                    )
                );


            datosHabitos.habitos.forEach(
                habito => {

                    if (
                        habito.ultimaFecha &&
                        habito.ultimaFecha !== hoy &&
                        habito.ultimaFecha !== ayer
                    ) {

                        habito.racha = 0;

                    }

                }
            );


            guardarDatosHabitos();

        }



        /* =================================================
           MOSTRAR HÁBITOS
        ================================================= */


        function mostrarHabitos() {

            const tabla =
                document.getElementById(
                    "tabla"
                );


            tabla.innerHTML = "";


            const hoy =
                obtenerFechaHoy();


            datosHabitos.habitos.forEach(
                (habito, indice) => {

                    const hechoHoy =
                        habito.ultimaFecha === hoy;


                    const contenedor =
                        document.createElement(
                            "div"
                        );


                    contenedor.className =
                        "contenedor-habito";


                    contenedor.innerHTML = `

                        <button
                            class="boton-borrar"
                            onclick="borrarHabito(${indice})">

                            −

                        </button>


                        <div
                            class="fila ${hechoHoy ? "hecho" : ""}">


                            <span
                                class="nombre-habito">

                                ${habito.nombre}

                            </span>


                            <div>

                                <span
                                    class="racha">

                                    🔥 ${habito.racha}

                                </span>


                                <button
                                    class="boton-hecho"
                                    onclick="marcarHabito(${indice})"
                                    ${hechoHoy ? "disabled" : ""}>

                                    ${hechoHoy
                                        ? "✓"
                                        : "Hecho"}

                                </button>

                            </div>


                        </div>


                        <button
                            class="boton-reiniciar"
                            onclick="reiniciarHabito(${indice})">

                            ↺

                        </button>

                    `;


                    tabla.appendChild(
                        contenedor
                    );

                }
            );

        }



        /* =================================================
           MARCAR HÁBITO
        ================================================= */


        function marcarHabito(indice) {

            const habito =
                datosHabitos.habitos[indice];


            if (!habito) {
                return false;
            }


            const hoy =
                obtenerFechaHoy();


            if (
                habito.ultimaFecha === hoy
            ) {
                return false;
            }


            habito.racha++;

            habito.ultimaFecha = hoy;


            guardarDatosHabitos();

            mostrarHabitos();


            return true;

        }



        /* =================================================
           AGREGAR HÁBITO
        ================================================= */


        function agregarHabito() {

            const nombre =
                prompt(
                    "Escribí el nuevo hábito:"
                );


            if (
                nombre === null ||
                nombre.trim() === ""
            ) {
                return;
            }


            datosHabitos.habitos.push({

                nombre:
                    nombre.trim(),

                racha:
                    0,

                ultimaFecha:
                    null

            });


            guardarDatosHabitos();

            mostrarHabitos();

        }



        /* =================================================
           REINICIAR HÁBITO
        ================================================= */


        function reiniciarHabito(indice) {

            if (
                !confirm(
                    "¿Seguro que querés reiniciar la racha?"
                )
            ) {
                return;
            }


            datosHabitos.habitos[indice].racha =
                0;


            datosHabitos.habitos[indice].ultimaFecha =
                null;


            guardarDatosHabitos();

            mostrarHabitos();

        }



        /* =================================================
           BORRAR HÁBITO
        ================================================= */


        function borrarHabito(indice) {

            if (
                !confirm(
                    "¿Seguro que querés borrar este hábito?"
                )
            ) {
                return;
            }


            datosHabitos.habitos.splice(
                indice,
                1
            );


            guardarDatosHabitos();

            mostrarHabitos();

        }



        /* =================================================
           TEMPORIZADOR DEL DÍA
        ================================================= */


        function actualizarTemporizador() {

            const ahora =
                new Date();


            const mañana =
                new Date();


            mañana.setDate(
                mañana.getDate() + 1
            );


            mañana.setHours(
                0,
                0,
                0,
                0
            );


            const restante =
                mañana.getTime() -
                ahora.getTime();


            const horas =
                Math.floor(
                    restante / 3600000
                );


            const minutos =
                Math.floor(
                    (restante % 3600000) /
                    60000
                );


            const segundos =
                Math.floor(
                    (restante % 60000) /
                    1000
                );


            document.getElementById(
                "temporizador"
            ).innerHTML = `

                <div class="tiempo">

                    ${String(horas).padStart(2, "0")}hs
                    ${String(minutos).padStart(2, "0")}min
                    ${String(segundos).padStart(2, "0")}seg

                </div>


                <div class="dia">

                    ${ahora.toLocaleDateString(
                        "es-AR",
                        {
                            weekday: "long",
                            day: "numeric",
                            month: "long"
                        }
                    )}

                </div>

            `;

        }



        /* =================================================
           ORGANIZADOR
        ================================================= */


        let diaOrganizador = 0;


        let actividades =
            JSON.parse(
                localStorage.getItem(
                    "actividadesOrganizador"
                )
            );


        if (!actividades) {
            actividades = {};
        }



        function guardarActividades() {

            localStorage.setItem(
                "actividadesOrganizador",
                JSON.stringify(actividades)
            );

        }



        /* =================================================
           LIMPIAR DÍAS PASADOS
           
           Conserva:
           HOY + 6 DÍAS FUTUROS
           
           Elimina automáticamente todo lo anterior.
        ================================================= */


        function limpiarDiasPasados() {

            const hoy =
                obtenerFechaHoy();


            Object.keys(actividades).forEach(
                fecha => {

                    if (fecha < hoy) {

                        delete actividades[fecha];

                    }

                }
            );


            guardarActividades();

        }



        /* =================================================
           OBTENER FECHA SEGÚN DÍA SELECCIONADO
           
           0 = hoy
           1 = mañana
           ...
           6 = seis días después
        ================================================= */


        function obtenerFechaSeleccionada() {

            const fecha =
                new Date();


            fecha.setHours(
                12,
                0,
                0,
                0
            );


            fecha.setDate(
                fecha.getDate() +
                diaOrganizador
            );


            return fechaLocal(fecha);

        }



        function nombreDia(fecha) {

            const fechaObj =
                new Date(
                    fecha + "T12:00:00"
                );


            return fechaObj
                .toLocaleDateString(
                    "es-AR",
                    {
                        weekday: "long"
                    }
                )
                .toUpperCase();

        }



        function mostrarOrganizador() {

            limpiarDiasPasados();


            const fecha =
                obtenerFechaSeleccionada();


            document.getElementById(
                "diaSeleccionado"
            ).textContent =
                nombreDia(fecha);


            mostrarActividades();

        }



        /* =================================================
           CAMBIAR DÍA
           
           Solamente permite:
           0 = hoy
           1 = mañana
           ...
           6 = seis días después
        ================================================= */


        function diaAnterior() {

            if (diaOrganizador > 0) {

                diaOrganizador--;

                mostrarOrganizador();

            }

        }



        function diaSiguiente() {

            if (diaOrganizador < 6) {

                diaOrganizador++;

                mostrarOrganizador();

            }

        }



        /* =================================================
           MOSTRAR ACTIVIDADES
        ================================================= */


        function mostrarActividades() {

            const lista =
                document.getElementById(
                    "listaActividades"
                );


            lista.innerHTML = "";


            const fecha =
                obtenerFechaSeleccionada();


            const actividadesDelDia =
                actividades[fecha] || [];


            actividadesDelDia.sort(
                (a, b) =>
                    a.inicio.localeCompare(
                        b.inicio
                    )
            );


            if (
                actividadesDelDia.length === 0
            ) {

                lista.innerHTML = `

                    <div class="mensaje-vacio">

                        No tenés actividades
                        programadas para este día.

                    </div>

                `;

                return;

            }



            actividadesDelDia.forEach(
                (actividad, indice) => {

                    const elemento =
                        document.createElement(
                            "div"
                        );


                    elemento.className =
                        "actividad";


                    if (
                        actividad.completada
                    ) {

                        elemento.classList.add(
                            "completada"
                        );

                    }


                    let etiquetaHabito = "";


                    if (
                        actividad.habitoIndice !== null &&
                        actividad.habitoIndice !== undefined
                    ) {

                        etiquetaHabito = `

                            <div class="etiqueta-habito">

                                🔥 Hábito

                            </div>

                        `;

                    }


                    const esHoy =
                        fecha ===
                        obtenerFechaHoy();


                    elemento.innerHTML = `

                        <div class="horario">

                            ${actividad.inicio}
                            -
                            ${actividad.fin}

                        </div>


                        <div class="descripcion">

                            ${actividad.descripcion}

                            ${etiquetaHabito}

                        </div>


                        <button
                            class="boton-completar"
                            onclick="completarActividad(${indice})"
                            ${!esHoy || actividad.completada
                                ? "disabled"
                                : ""}>

                            ${actividad.completada
                                ? "✓"
                                : "○"}

                        </button>


                        <button
                            class="boton-eliminar-actividad"
                            onclick="eliminarActividad(${indice})">

                            ✕

                        </button>

                    `;


                    lista.appendChild(
                        elemento
                    );

                }
            );

        }



        /* =================================================
           FORMULARIO
        ================================================= */


        function mostrarFormulario() {

            const input =
                document.getElementById(
                    "descripcionActividad"
                );

            input.value = "";
            delete input.dataset.habitoIndice;
            input.focus();

        }



        /* =================================================
           MOSTRAR SUGERENCIAS
        ================================================= */


        function mostrarSugerencias() {

            const input =
                document.getElementById(
                    "descripcionActividad"
                );


            const contenedor =
                document.getElementById(
                    "sugerenciasHabitos"
                );


            contenedor.innerHTML = "";


            if (
                datosHabitos.habitos.length === 0
            ) {

                contenedor.style.display =
                    "none";

                return;

            }


            datosHabitos.habitos.forEach(
                (habito, indice) => {

                    const elemento =
                        document.createElement(
                            "div"
                        );


                    elemento.className =
                        "sugerencia";


                    elemento.textContent =
                        "🔥 " +
                        habito.nombre;


                    elemento.onclick =
                        function(event) {

                            event.stopPropagation();

                            seleccionarHabitoDesdeCampo(
                                indice
                            );

                        };


                    contenedor.appendChild(
                        elemento
                    );

                }
            );


            contenedor.style.display =
                "block";

        }



        /* =================================================
           FILTRAR SUGERENCIAS
        ================================================= */


        function filtrarSugerencias() {

            const input =
                document.getElementById(
                    "descripcionActividad"
                );


            const contenedor =
                document.getElementById(
                    "sugerenciasHabitos"
                );


            const texto =
                input.value
                    .trim()
                    .toLowerCase();


            contenedor.innerHTML = "";


            if (
                datosHabitos.habitos.length === 0
            ) {

                contenedor.style.display =
                    "none";

                return;

            }


            const resultados =
                datosHabitos.habitos.filter(
                    habito =>
                        habito.nombre
                            .toLowerCase()
                            .includes(texto)
                );


            if (
                resultados.length === 0
            ) {

                contenedor.style.display =
                    "none";

                return;

            }


            resultados.forEach(
                habito => {

                    const indice =
                        datosHabitos.habitos
                            .indexOf(
                                habito
                            );


                    const elemento =
                        document.createElement(
                            "div"
                        );


                    elemento.className =
                        "sugerencia";


                    elemento.textContent =
                        "🔥 " +
                        habito.nombre;


                    elemento.onclick =
                        function(event) {

                            event.stopPropagation();

                            seleccionarHabitoDesdeCampo(
                                indice
                            );

                        };


                    contenedor.appendChild(
                        elemento
                    );

                }
            );


            contenedor.style.display =
                "block";

        }



        /* =================================================
           SELECCIONAR HÁBITO
        ================================================= */


        function seleccionarHabitoDesdeCampo(
            indice
        ) {

            const input =
                document.getElementById(
                    "descripcionActividad"
                );


            input.value =
                datosHabitos
                    .habitos[indice]
                    .nombre;


            input.dataset.habitoIndice =
                indice;


            document.getElementById(
                "sugerenciasHabitos"
            ).style.display =
                "none";

        }



        /* =================================================
           GUARDAR ACTIVIDAD
        ================================================= */


        function guardarActividad() {

            const inicio =
                document.getElementById(
                    "horaInicio"
                ).value;


            const fin =
                document.getElementById(
                    "horaFin"
                ).value;


            const input =
                document.getElementById(
                    "descripcionActividad"
                );


            const descripcion =
                input.value.trim();


            if (
                !inicio ||
                !fin ||
                !descripcion
            ) {

                alert(
                    "Completá todos los campos."
                );

                return;

            }


            if (
                fin <= inicio
            ) {

                alert(
                    "La hora de finalización debe ser posterior a la de inicio."
                );

                return;

            }


            const fecha =
                obtenerFechaSeleccionada();


            if (
                !actividades[fecha]
            ) {

                actividades[fecha] = [];

            }


            let habitoIndice = null;


            if (
                input.dataset.habitoIndice !== undefined
            ) {

                habitoIndice =
                    Number(
                        input.dataset.habitoIndice
                    );

            }


            actividades[fecha].push({

                inicio:
                    inicio,

                fin:
                    fin,

                descripcion:
                    descripcion,

                habitoIndice:
                    habitoIndice,

                completada:
                    false

            });


            guardarActividades();


            document.getElementById(
                "horaInicio"
            ).value = "";


            document.getElementById(
                "horaFin"
            ).value = "";


            input.value = "";

            delete input.dataset.habitoIndice;


            document.getElementById(
                "sugerenciasHabitos"
            ).style.display =
                "none";


            mostrarActividades();

        }



        /* =================================================
           COMPLETAR ACTIVIDAD
        ================================================= */


        function completarActividad(indice) {

            const fecha =
                obtenerFechaSeleccionada();


            if (
                fecha !== obtenerFechaHoy()
            ) {

                return;

            }


            const lista =
                actividades[fecha];


            if (!lista) {
                return;
            }


            const actividad =
                lista[indice];


            if (
                actividad.completada
            ) {

                return;

            }


            actividad.completada =
                true;


            if (
                actividad.habitoIndice !== null &&
                actividad.habitoIndice !== undefined
            ) {

                const indiceHabito =
                    actividad.habitoIndice;


                if (
                    datosHabitos.habitos[
                        indiceHabito
                    ]
                ) {

                    marcarHabito(
                        indiceHabito
                    );

                }

            }


            guardarActividades();

            mostrarActividades();

        }



        /* =================================================
           ELIMINAR ACTIVIDAD
        ================================================= */


        function eliminarActividad(indice) {

            const fecha =
                obtenerFechaSeleccionada();


            if (
                !actividades[fecha]
            ) {

                return;

            }


            actividades[fecha].splice(
                indice,
                1
            );


            guardarActividades();

            mostrarActividades();

        }



        /* =================================================
           CERRAR SUGERENCIAS
        ================================================= */


        document.addEventListener(
            "click",
            function(event) {

                const campo =
                    document.querySelector(
                        ".campo-actividad"
                    );


                const sugerencias =
                    document.getElementById(
                        "sugerenciasHabitos"
                    );


                if (
                    campo &&
                    !campo.contains(
                        event.target
                    )
                ) {

                    sugerencias.style.display =
                        "none";

                }

            }
        );



        /* =================================================
           POMODORO
        ================================================= */


        let pomodoroIntervalo = null;

        let pomodoroCorriendo = false;

        let pomodoroModo = "trabajo";

        let pomodoroCicloActual = 1;

        let pomodoroSegundosRestantes = 0;

        let pomodoroAviso10Emitido = false;

        let pomodoroFinTimestamp = null;



        /* =================================================
           AUDIOS DEL POMODORO

           1. 10 segundos antes de terminar TRABAJO:
              pomodoro-aviso-trabajo.mp3

           2. Al terminar una fase:
              pomodoro-cambio.mp3

           3. 10 segundos antes de terminar DESCANSO:
              pomodoro-aviso-descanso.mp3
        ================================================= */


        let audiosPomodoroDesbloqueados = false;


        function desbloquearAudiosPomodoro() {

            if (audiosPomodoroDesbloqueados) {
                return;
            }


            const audios = [

                document.getElementById(
                    "audioAvisoTrabajo"
                ),

                document.getElementById(
                    "audioCambioPomodoro"
                ),

                document.getElementById(
                    "audioAvisoDescanso"
                )

            ];


            audios.forEach(
                audio => {

                    if (!audio) {
                        return;
                    }


                    audio.muted = true;


                    const promesa =
                        audio.play();


                    if (promesa) {

                        promesa.then(
                            () => {

                                audio.pause();

                                audio.currentTime = 0;

                                audio.muted = false;

                            }
                        ).catch(
                            () => {

                                audio.muted = false;

                            }
                        );

                    }

                }
            );


            audiosPomodoroDesbloqueados = true;

        }


        function reproducirAudioPomodoro(
            elemento
        ) {

            if (
                !elemento ||
                !elemento.getAttribute("src")
            ) {

                return false;

            }


            try {

                elemento.pause();

                elemento.currentTime = 0;

                elemento.muted = false;


                const promesa =
                    elemento.play();


                if (promesa) {

                    promesa.catch(
                        () => {

                            console.log(
                                "El navegador bloqueó el audio del Pomodoro."
                            );

                        }
                    );

                }


                return true;

            }

            catch (error) {

                return false;

            }

        }


        function sonarAlarma() {

            const audio =
                document.getElementById(
                    "audioCambioPomodoro"
                );


            if (
                reproducirAudioPomodoro(
                    audio
                )
            ) {

                return;

            }


            /*
             * Respaldo si no existe el archivo.
             */

            try {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;


                if (!AudioContext) {
                    return;
                }


                const contexto =
                    new AudioContext();


                const oscilador =
                    contexto.createOscillator();


                const ganancia =
                    contexto.createGain();


                oscilador.type =
                    "sine";


                oscilador.frequency.setValueAtTime(
                    880,
                    contexto.currentTime
                );


                ganancia.gain.setValueAtTime(
                    0.001,
                    contexto.currentTime
                );


                ganancia.gain.exponentialRampToValueAtTime(
                    0.4,
                    contexto.currentTime + 0.03
                );


                ganancia.gain.exponentialRampToValueAtTime(
                    0.001,
                    contexto.currentTime + 0.6
                );


                oscilador.connect(
                    ganancia
                );


                ganancia.connect(
                    contexto.destination
                );


                oscilador.start();


                oscilador.stop(
                    contexto.currentTime + 0.6
                );


                setTimeout(
                    () => {
                        contexto.close();
                    },
                    1000
                );

            }

            catch (error) {

                console.log(
                    "No se pudo reproducir la alarma."
                );

            }

        }


        function sonarAvisoTrabajo() {

            reproducirAudioPomodoro(
                document.getElementById(
                    "audioAvisoTrabajo"
                )
            );

        }


        function sonarAvisoDescanso() {

            reproducirAudioPomodoro(
                document.getElementById(
                    "audioAvisoDescanso"
                )
            );

        }


        /* =================================================
           LEER CONFIGURACIÓN
        ================================================= */


        function obtenerConfiguracionPomodoro() {

            const trabajo =
                Number(
                    document.getElementById(
                        "minutosTrabajo"
                    ).value
                );


            const descanso =
                Number(
                    document.getElementById(
                        "minutosDescanso"
                    ).value
                );


            const ciclos =
                Number(
                    document.getElementById(
                        "cantidadCiclos"
                    ).value
                );


            return {

                trabajo:
                    trabajo > 0
                        ? trabajo
                        : 40,

                descanso:
                    descanso > 0
                        ? descanso
                        : 10,

                ciclos:
                    ciclos > 0
                        ? ciclos
                        : 4

            };

        }



        /* =================================================
           INICIAR POMODORO
        ================================================= */


        function iniciarPomodoro() {

            if (pomodoroCorriendo) {
                return;
            }


            /*
             * Desbloqueamos los audios con el clic del usuario.
             * Esto ayuda con las políticas de reproducción
             * automática de celulares y navegadores.
             */
            desbloquearAudiosPomodoro();


            const configuracion =
                obtenerConfiguracionPomodoro();


            if (
                pomodoroSegundosRestantes <= 0
            ) {

                pomodoroAviso10Emitido = false;


                if (
                    pomodoroModo === "trabajo"
                ) {

                    pomodoroSegundosRestantes =
                        configuracion.trabajo *
                        60;

                }

                else {

                    pomodoroSegundosRestantes =
                        configuracion.descanso *
                        60;

                }

            }


            pomodoroCorriendo = true;


            /*
             * Guardamos el momento exacto en el que termina
             * la fase. Así el contador no se desincroniza
             * si el navegador tarda un poco en ejecutar un tick.
             */
            pomodoroFinTimestamp =
                Date.now() +
                pomodoroSegundosRestantes *
                1000;


            document.getElementById(
                "botonPomodoroIniciar"
            ).disabled = true;


            document.getElementById(
                "botonPomodoroPausa"
            ).disabled = false;


            pomodoroIntervalo =
                setInterval(
                    actualizarPomodoro,
                    1000
                );


            actualizarPomodoroPantalla();

        }



        /* =================================================
           PAUSAR POMODORO
        ================================================= */


        function pausarPomodoro() {

            if (!pomodoroCorriendo) {
                return;
            }


            clearInterval(
                pomodoroIntervalo
            );


            pomodoroIntervalo =
                null;


            if (pomodoroFinTimestamp !== null) {

                pomodoroSegundosRestantes =
                    Math.max(
                        0,
                        Math.ceil(
                            (pomodoroFinTimestamp - Date.now()) /
                            1000
                        )
                    );

            }


            pomodoroFinTimestamp =
                null;


            pomodoroCorriendo =
                false;


            document.getElementById(
                "botonPomodoroIniciar"
            ).disabled = false;


            document.getElementById(
                "botonPomodoroIniciar"
            ).textContent =
                "▶ Continuar";


            document.getElementById(
                "botonPomodoroPausa"
            ).disabled = true;

        }



        /* =================================================
           ACTUALIZAR POMODORO
        ================================================= */


        function actualizarPomodoro() {

            if (!pomodoroCorriendo) {
                return;
            }


            const segundosCalculados =
                Math.max(
                    0,
                    Math.ceil(
                        (pomodoroFinTimestamp - Date.now()) /
                        1000
                    )
                );


            pomodoroSegundosRestantes =
                segundosCalculados;


            /*
             * Usamos <= 10 y no === 10.
             * Si el navegador salta de 11 a 9 por un pequeño
             * retraso, el aviso igualmente se reproduce.
             */
            if (
                pomodoroSegundosRestantes <= 10 &&
                pomodoroSegundosRestantes > 0 &&
                !pomodoroAviso10Emitido
            ) {

                pomodoroAviso10Emitido = true;


                if (pomodoroModo === "trabajo") {

                    sonarAvisoTrabajo();

                }

                else {

                    sonarAvisoDescanso();

                }

            }


            if (pomodoroSegundosRestantes <= 0) {

                pomodoroSegundosRestantes = 0;

                actualizarPomodoroPantalla();
                cambiarFasePomodoro();
                return;

            }


            actualizarPomodoroPantalla();

        }


        /* =================================================
           CAMBIAR DE TRABAJO A DESCANSO
           
           IMPORTANTE:
           El timer NO se detiene.
           Suena la alarma y empieza
           inmediatamente la siguiente fase.
        ================================================= */


        function cambiarFasePomodoro() {

            const configuracion =
                obtenerConfiguracionPomodoro();


            sonarAlarma();


            /* El aviso de 10 segundos vuelve a estar disponible
               para la nueva fase. */
            pomodoroAviso10Emitido = false;


            if (
                pomodoroModo === "trabajo"
            ) {

                pomodoroModo =
                    "descanso";


                pomodoroSegundosRestantes =
                    configuracion.descanso *
                    60;

            }


            else {

                if (
                    pomodoroCicloActual >=
                    configuracion.ciclos
                ) {

                    clearInterval(
                        pomodoroIntervalo
                    );


                    pomodoroIntervalo =
                        null;


                    pomodoroCorriendo =
                        false;


                    pomodoroModo =
                        "trabajo";


                    pomodoroCicloActual =
                        1;


                    pomodoroSegundosRestantes =
                        configuracion.trabajo *
                        60;


                    pomodoroFinTimestamp = null;
                    pomodoroAviso10Emitido = false;


                    document.getElementById(
                        "botonPomodoroIniciar"
                    ).disabled = false;


                    document.getElementById(
                        "botonPomodoroIniciar"
                    ).textContent =
                        "▶ Iniciar";


                    document.getElementById(
                        "botonPomodoroPausa"
                    ).disabled = true;


                    actualizarPomodoroPantalla();


                    return;

                }


                pomodoroCicloActual++;


                pomodoroModo =
                    "trabajo";


                pomodoroSegundosRestantes =
                    configuracion.trabajo *
                    60;

            }


            pomodoroFinTimestamp =
                Date.now() +
                pomodoroSegundosRestantes *
                1000;


            actualizarPomodoroPantalla();

        }



        /* =================================================
           ACTUALIZAR PANTALLA POMODORO
        ================================================= */


        function actualizarPomodoroPantalla() {

            const minutos =
                Math.floor(
                    pomodoroSegundosRestantes /
                    60
                );


            const segundos =
                pomodoroSegundosRestantes %
                60;


            document.getElementById(
                "pomodoroReloj"
            ).textContent =

                String(minutos).padStart(2, "0") +
                ":" +
                String(segundos).padStart(2, "0");


            document.getElementById(
                "pomodoroEstado"
            ).textContent =

                pomodoroModo === "trabajo"
                    ? "🧠 TRABAJO"
                    : "☕ DESCANSO";


            const configuracion =
                obtenerConfiguracionPomodoro();


            document.getElementById(
                "pomodoroCiclo"
            ).textContent =

                "Ciclo " +
                pomodoroCicloActual +
                " de " +
                configuracion.ciclos;

        }



        /* =================================================
           REINICIAR POMODORO
        ================================================= */


        function reiniciarPomodoro() {

            clearInterval(
                pomodoroIntervalo
            );


            pomodoroIntervalo =
                null;


            pomodoroCorriendo =
                false;


            pomodoroModo =
                "trabajo";


            pomodoroCicloActual =
                1;


            const configuracion =
                obtenerConfiguracionPomodoro();


            pomodoroSegundosRestantes =
                configuracion.trabajo *
                60;


            pomodoroFinTimestamp = null;
            pomodoroAviso10Emitido = false;


            document.getElementById(
                "botonPomodoroIniciar"
            ).disabled = false;


            document.getElementById(
                "botonPomodoroIniciar"
            ).textContent =
                "▶ Iniciar";


            document.getElementById(
                "botonPomodoroPausa"
            ).disabled = true;


            actualizarPomodoroPantalla();

        }



        /* =================================================
           CUANDO SE MODIFICA LA CONFIGURACIÓN
        ================================================= */


        document.getElementById(
            "minutosTrabajo"
        ).addEventListener(
            "change",
            function() {

                if (!pomodoroCorriendo) {

                    reiniciarPomodoro();

                }

            }
        );


        document.getElementById(
            "minutosDescanso"
        ).addEventListener(
            "change",
            function() {

                if (!pomodoroCorriendo) {

                    reiniciarPomodoro();

                }

            }
        );


        document.getElementById(
            "cantidadCiclos"
        ).addEventListener(
            "change",
            function() {

                actualizarPomodoroPantalla();

            }
        );



        /* =================================================
           INICIALIZACIÓN
        ================================================= */


        cargarModoOscuro();


        limpiarDiasPasados();


        actualizarHabitos();


        mostrarHabitos();


        actualizarTemporizador();


        reiniciarPomodoro();


        setInterval(
            actualizarTemporizador,
            1000
        );


        setInterval(
            () => {

                actualizarHabitos();

                mostrarHabitos();


                /*
                 * Si cambió el día,
                 * volvemos automáticamente
                 * al día actual del organizador.
                 */

                const hoy =
                    obtenerFechaHoy();


                if (
                    window.ultimoDiaConocido &&
                    window.ultimoDiaConocido !== hoy
                ) {

                    diaOrganizador = 0;

                    limpiarDiasPasados();

                }


                window.ultimoDiaConocido =
                    hoy;


                const pantalla =
                    document.getElementById(
                        "pantallaOrganizador"
                    );


                if (
                    pantalla.classList.contains(
                        "activa"
                    )
                ) {

                    mostrarOrganizador();

                }


            },
            60000
        );


        window.ultimoDiaConocido =
            obtenerFechaHoy();


    </script>

</body>
